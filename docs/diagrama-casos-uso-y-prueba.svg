<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510" role="img" aria-labelledby="title description">
  <title id="title">LessionAngel: casos de uso y pruebas de aceptación</title>
  <desc id="description">Flujo de conexión BLE, captura de señal EMG y análisis de sesiones, seguido por un resumen de 19 pruebas de aceptación. Los pasos completos están en casos-de-uso-y-pruebas.md.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #596078; }
      .panel { fill: #fbfbff; stroke: #5040a0; stroke-width: 2; }
      .panel-title { font-size: 19px; font-weight: 700; fill: #403582; }
      .body { font-size: 14px; }
      .id { font-weight: 700; fill: #403582; }
      .arrow { stroke: #5040a0; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .sensor { fill: #e9f8ef; stroke: #25804c; stroke-width: 2; }
      .sensor-title { font-size: 16px; font-weight: 700; fill: #175a34; }
      .head { fill: #5040a0; }
      .head-text { fill: #fff; font-size: 14px; font-weight: 700; }
      .row-a { fill: #fff; }
      .row-b { fill: #f3f2fa; }
      .cell { stroke: #d7d8e2; stroke-width: 1; }
      .cell-text { font-size: 12.5px; }
      .tc { font-weight: 700; fill: #403582; }
      .note { font-size: 13px; fill: #596078; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5040a0"/>
    </marker>
  </defs>
  <rect width="1400" height="1510" fill="#fff"/>
  <text x="700" y="42" class="title" text-anchor="middle">LessionAngel — casos de uso y pruebas</text>
  <text x="700" y="68" class="subtitle" text-anchor="middle">Flujo real de BLE/EMG · especificación completa y pasos en docs/casos-de-uso-y-pruebas.md</text>

  <rect x="35" y="100" width="405" height="490" rx="14" class="panel"/>
  <text x="237" y="135" class="panel-title" text-anchor="middle">Pantalla 1 · Conexión BLE</text>
  <text x="65" y="180" class="body"><tspan class="id">UC01</tspan><tspan>  Buscar periféricos BLE</tspan></text>
  <text x="65" y="220" class="body"><tspan class="id">UC02</tspan><tspan>  Elegir la ESP32 detectada</tspan></text>
  <text x="65" y="260" class="body"><tspan class="id">UC03</tspan><tspan>  Conectar por GATT</tspan></text>
  <text x="88" y="284" class="body">y activar notificaciones EMG TX</text>
  <text x="65" y="340" class="body"><tspan class="id">UC13</tspan><tspan>  Volver atrás</tspan></text>
  <text x="65" y="380" class="body"><tspan class="id">UC14</tspan><tspan>  Salir con confirmación</tspan></text>
  <text x="65" y="520" class="note">Continuar solo está disponible</text>
  <text x="65" y="541" class="note">cuando la suscripción BLE funciona.</text>

  <path d="M445 340 H485" class="arrow"/>
  <rect x="490" y="100" width="405" height="490" rx="14" class="panel"/>
  <text x="692" y="135" class="panel-title" text-anchor="middle">Pantalla 2 · Entrenamiento</text>
  <text x="520" y="180" class="body"><tspan class="id">UC04</tspan><tspan>  Recibir tiempo y ADC</tspan></text>
  <text x="520" y="220" class="body"><tspan class="id">UC05</tspan><tspan>  Iniciar captura</tspan></text>
  <text x="520" y="260" class="body"><tspan class="id">UC06</tspan><tspan>  Ver señal EMG en vivo</tspan></text>
  <text x="520" y="300" class="body"><tspan class="id">UC07</tspan><tspan>  Detener captura</tspan></text>
  <text x="520" y="340" class="body"><tspan class="id">UC08</tspan><tspan>  Guardar y abrir análisis</tspan></text>
  <text x="520" y="380" class="body"><tspan class="id">UC09</tspan><tspan>  Consultar sesiones guardadas</tspan></text>
  <text x="520" y="420" class="body"><tspan class="id">UC13</tspan><tspan>  Volver atrás</tspan></text>
  <text x="520" y="460" class="body"><tspan class="id">UC14</tspan><tspan>  Salir con confirmación</tspan></text>
  <text x="520" y="530" class="note">Muestras tomadas de la ESP32,</text>
  <text x="520" y="551" class="note">sin datos inventados.</text>

  <path d="M900 340 H940" class="arrow"/>
  <rect x="945" y="100" width="420" height="490" rx="14" class="panel"/>
  <text x="1155" y="135" class="panel-title" text-anchor="middle">Pantalla 3 · Análisis</text>
  <text x="975" y="180" class="body"><tspan class="id">UC08</tspan><tspan>  Revisar estadísticas y gráfico</tspan></text>
  <text x="975" y="220" class="body"><tspan class="id">UC10</tspan><tspan>  Exportar una sesión a CSV</tspan></text>
  <text x="975" y="260" class="body"><tspan class="id">UC11</tspan><tspan>  Hacer otra sesión</tspan></text>
  <text x="975" y="300" class="body"><tspan class="id">UC12</tspan><tspan>  Borrar la sesión actual</tspan></text>
  <text x="975" y="340" class="body"><tspan class="id">UC13</tspan><tspan>  Volver atrás</tspan></text>
  <text x="975" y="380" class="body"><tspan class="id">UC14</tspan><tspan>  Salir con confirmación</tspan></text>
  <rect x="975" y="455" width="355" height="88" rx="10" class="sensor"/>
  <text x="1152" y="483" text-anchor="middle" class="sensor-title">ESP32 LESSION · BLE UART</text>
  <text x="1152" y="510" text-anchor="middle" class="body">Notificación TX: t_ms,adc LF</text>
  <text x="1152" y="532" text-anchor="middle" class="body">ADC 0–4095 · envolvente EMG</text>

  <text x="700" y="638" class="panel-title" text-anchor="middle">Pruebas de aceptación · precondición, pasos y resultado esperado</text>
  <rect x="40" y="660" width="1320" height="34" class="head"/>
  <text x="58" y="683" class="head-text">ID</text>
  <text x="130" y="683" class="head-text">Prueba</text>
  <text x="570" y="683" class="head-text">Criterio de éxito</text>

  <g class="cell-text">
    <rect x="40" y="694" width="1320" height="34" class="row-a cell"/><text x="58" y="716" class="tc">TC01</text><text x="130" y="716">Permisos BLE</text><text x="570" y="716">Con permiso escanea; si se deniega, informa y no simula conexión.</text>
    <rect x="40" y="728" width="1320" height="34" class="row-b cell"/><text x="58" y="750" class="tc">TC02</text><text x="130" y="750">Encontrar ESP32 anunciada</text><text x="570" y="750">La lista contiene el periférico anunciado por la placa.</text>
    <rect x="40" y="762" width="1320" height="34" class="row-a cell"/><text x="58" y="784" class="tc">TC03</text><text x="130" y="784">Escaneo sin placa</text><text x="570" y="784">Informa que no hay dispositivos; no ofrece resultados falsos.</text>
    <rect x="40" y="796" width="1320" height="34" class="row-b cell"/><text x="58" y="818" class="tc">TC04</text><text x="130" y="818">Conexión y suscripción GATT</text><text x="570" y="818">Descubre el servicio y confirma la suscripción a notificaciones TX.</text>
    <rect x="40" y="830" width="1320" height="34" class="row-a cell"/><text x="58" y="852" class="tc">TC05</text><text x="130" y="852">Periférico con servicio incorrecto</text><text x="570" y="852">Informa el servicio EMG esperado como ausente.</text>
    <rect x="40" y="864" width="1320" height="34" class="row-b cell"/><text x="58" y="886" class="tc">TC06</text><text x="130" y="886">Notificación EMG válida</text><text x="570" y="886">ADC, tiempo, contador y gráfico reflejan la muestra recibida.</text>
    <rect x="40" y="898" width="1320" height="34" class="row-a cell"/><text x="58" y="920" class="tc">TC07</text><text x="130" y="920">Paquete inválido o incompleto</text><text x="570" y="920">Descarta la muestra mala y acepta la siguiente válida.</text>
    <rect x="40" y="932" width="1320" height="34" class="row-b cell"/><text x="58" y="954" class="tc">TC08</text><text x="130" y="954">Continuar sin conexión GATT</text><text x="570" y="954">Continuar está deshabilitado y no se puede iniciar una captura.</text>
    <rect x="40" y="966" width="1320" height="34" class="row-a cell"/><text x="58" y="988" class="tc">TC09</text><text x="130" y="988">Grabar muestras reales</text><text x="570" y="988">La sesión contiene exactamente los ADC recibidos mientras se graba.</text>
    <rect x="40" y="1000" width="1320" height="34" class="row-b cell"/><text x="58" y="1022" class="tc">TC10</text><text x="130" y="1022">Detener y guardar captura</text><text x="570" y="1022">Detiene nuevas muestras y conserva las ya recibidas.</text>
    <rect x="40" y="1034" width="1320" height="34" class="row-a cell"/><text x="58" y="1056" class="tc">TC11</text><text x="130" y="1056">No guardar sesión vacía</text><text x="570" y="1056">No aparece una sesión sin muestras en el historial.</text>
    <rect x="40" y="1068" width="1320" height="34" class="row-b cell"/><text x="58" y="1090" class="tc">TC12</text><text x="130" y="1090">Análisis de sesión</text><text x="570" y="1090">Fecha, duración, estadísticas y gráfico corresponden a sus muestras.</text>
    <rect x="40" y="1102" width="1320" height="34" class="row-a cell"/><text x="58" y="1124" class="tc">TC13</text><text x="130" y="1124">Iniciar sesión nueva</text><text x="570" y="1124">La nueva captura no mezcla ni borra la sesión previa.</text>
    <rect x="40" y="1136" width="1320" height="34" class="row-b cell"/><text x="58" y="1158" class="tc">TC14</text><text x="130" y="1158">Persistencia del historial</text><text x="570" y="1158">Tras reiniciar y reconectar la ESP32, las sesiones siguen disponibles.</text>
    <rect x="40" y="1170" width="1320" height="34" class="row-a cell"/><text x="58" y="1192" class="tc">TC15</text><text x="130" y="1192">Exportar sesión a CSV</text><text x="570" y="1192">CSV contiene cabecera, metadatos y una fila por muestra de esa sesión.</text>
    <rect x="40" y="1204" width="1320" height="34" class="row-b cell"/><text x="58" y="1226" class="tc">TC16</text><text x="130" y="1226">Cancelar exportación CSV</text><text x="570" y="1226">No crea archivo y la app permanece en la pantalla actual.</text>
    <rect x="40" y="1238" width="1320" height="34" class="row-a cell"/><text x="58" y="1260" class="tc">TC17</text><text x="130" y="1260">Borrar sesión seleccionada</text><text x="570" y="1260">Solo se elimina la sesión elegida; el resto permanece intacto.</text>
    <rect x="40" y="1272" width="1320" height="34" class="row-b cell"/><text x="58" y="1294" class="tc">TC18</text><text x="130" y="1294">Atrás y cancelar salida</text><text x="570" y="1294">Navega a la pantalla previa; cancelar mantiene la app abierta.</text>
    <rect x="40" y="1306" width="1320" height="34" class="row-a cell"/><text x="58" y="1328" class="tc">TC19</text><text x="130" y="1328">Confirmar salida grabando</text><text x="570" y="1328">Cierra la app y conserva como sesión las muestras capturadas.</text>
  </g>
  <path d="M112 660 V1340 M552 660 V1340" class="cell"/>
  <text x="40" y="1382" class="note">TC01–TC19 son pruebas manuales. TC02–TC04 y TC06–TC10 requieren la ESP32; TC05 y TC07 requieren un periférico BLE de prueba.</text>
  <text x="40" y="1407" class="note">Las muestras son cuentas ADC de la envolvente EMG rectificada y suavizada; no equivalen a pulso, fuerza ni milivoltios.</text>
  <text x="40" y="1455" class="note">Pasos reproducibles y datos de entrada/salida completos: docs/casos-de-uso-y-pruebas.md · Fuente editable: docs/diagrama-casos-uso-y-prueba.puml</text>
</svg>
